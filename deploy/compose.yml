# Production stack on the shared server: compose project "desal" in /opt/desal
# (docs/hosting.md). scripts/deploy/deploy.sh copies this file there and writes
# .env with SIMULATOR_IMAGE. Every container is capped: the server has 2 GB RAM.
# Nothing is published publicly: Caddy on the host reaches Kafka UI on
# 127.0.0.1:8080, and Kafka's 127.0.0.1:9092 is for SSH tunnels from the laptop.
name: desal

services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: desal-kafka
    restart: unless-stopped
    mem_limit: 768m
    pids_limit: 512
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # HOST: tools on the server or over an SSH tunnel (localhost:9092).
      # DOCKER: the simulator and Kafka UI on the compose network (kafka:29092).
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
      # Topic data lives in the volume: the compacted plant.state topic in here is
      # the career save game (docs/hosting.md, "Backups").
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  simulator:
    image: ${SIMULATOR_IMAGE:?set by deploy.sh}
    container_name: desal-simulator
    restart: unless-stopped
    init: true
    mem_limit: 256m
    pids_limit: 128
    # main.ts writes a final snapshot on SIGTERM; give it time.
    stop_grace_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    container_name: desal-kafka-ui
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 256
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: desal
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: "-Xmx192m"

volumes:
  kafka-data:
